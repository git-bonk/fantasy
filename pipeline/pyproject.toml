[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasynfl"
version = "0.1.0"
description = "ESPN fantasy football data pipeline: scrape, compute, store."
requires-python = ">=3.11"
dependencies = [
    "espn_api>=0.46.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
fantasynfl = "fantasynfl.cli:main"

[tool.setuptools.packages.find]
include = ["fantasynfl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
