services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/fantasynfl.db
    volumes:
      - league-data:/data
    depends_on:
      pipeline:
        condition: service_healthy
    restart: unless-stopped

  pipeline:
    build: ./pipeline
    # ESPN credentials for the weekly ingest (copy .env.example -> .env).
    # Optional: without it the container seeds a sample season instead.
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/fantasynfl.db
    volumes:
      - league-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/fantasynfl.db || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

volumes:
  league-data:
