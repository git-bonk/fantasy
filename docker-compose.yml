services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_PATH: /data/fantasynfl.db
      REVEAL_PASSCODE: ${REVEAL_PASSCODE:-}
      REVEAL_SECRET: ${REVEAL_SECRET:-}
    volumes:
      - league-data:/data
    depends_on:
      pipeline:
        condition: service_healthy
    restart: unless-stopped

  pipeline:
    build: ./pipeline
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/fantasynfl.db
      OVERRIDES_PATH: /data/overrides.json
    volumes:
      - league-data:/data
      - type: bind
        source: ./overrides.json
        target: /data/overrides.json
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/fantasynfl.db || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped

volumes:
  league-data:
